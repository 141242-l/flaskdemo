{% extends "layout.html" %}

{% block title %}Results for "{{ search_term }}"{% endblock %}

{% block content %}
  <h1>{{ page.title }}</h1>

  <p><em>Search term:</em> {{ search_term }}</p>

  <p>{{ page.summary }}</p>

  <p>
    <a href="{{ page.url }}" target="_blank">
      Read the full article on Wikipedia
    </a>
  </p>
{% endblock %}
